<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ردا · REDA — Men's Wear</title>


<style>
:root{--bg:#121316;--bg2:#191b20;--panel:#1f2228;--line:rgba(216,195,160,.16);--sand:#d8c3a0;--sand2:#efe2c8;--ink:#eceae5;--mut:#9a9aa3;--ac:#c9a56a;--ok:#6fbf8b;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',system-ui,sans-serif;line-height:1.7;padding-bottom:74px;overflow-x:hidden}
h1,h2,h3,.disp{font-family:'Reem Kufi','Vazirmatn',sans-serif;font-weight:600;line-height:1.3}
html[lang=en] h1,html[lang=en] h2,html[lang=en] h3,html[lang=en] .disp,html[lang=en] .logo{font-family:'Cormorant Garamond',serif;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:40;background:rgba(18,19,22,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.logo{font-family:'Reem Kufi';font-size:24px;color:var(--sand2);letter-spacing:.5px;display:flex;align-items:baseline;gap:7px}
.logo small{font-size:12px;letter-spacing:3px;color:var(--ac);font-family:'Vazirmatn'}
.dnav{display:none;gap:22px;font-size:15px;color:var(--mut)}.dnav a:hover{color:var(--sand2)}
@media(min-width:900px){.dnav{display:flex}}
.hdr-r{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-size:12.5px}
.lang button{padding:5px 10px;color:var(--mut)}.lang button.on{background:var(--sand);color:#1a1509;font-weight:700}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid var(--line)}
.ic svg{width:20px;height:20px;stroke:var(--sand2);fill:none;stroke-width:1.7}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--ac);color:#1a1509;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.hero{padding:38px 0 30px;background:radial-gradient(900px 480px at 80% 0,#2b2a28 0,#17181b 60%,#121316 100%)}
.hero h1{font-size:clamp(30px,5.6vw,56px);color:#fff;margin-bottom:10px}.hero h1 em{font-style:normal;color:var(--sand)}
.hero p.sub{color:var(--mut);max-width:620px;font-size:15.5px;margin-bottom:20px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.btn{padding:11px 20px;border-radius:99px;font-weight:600;font-size:14.5px;border:1px solid var(--line);transition:.2s}
.btn.pri{background:var(--sand);color:#1a1509;border-color:var(--sand)}.btn.pri:hover{background:var(--sand2)}
.btn:not(.pri):hover{border-color:var(--sand)}
.btn.wa{background:#25a65b;border-color:#25a65b;color:#fff}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{height:4px}.strip::-webkit-scrollbar-thumb{background:var(--line)}
.strip .sc{flex:0 0 150px;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--panel);scroll-snap-align:start;cursor:pointer;border:1px solid var(--line)}
.strip img{width:100%;height:100%;object-fit:cover}
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:26px 0}
@media(min-width:800px){.feats{grid-template-columns:repeat(4,1fr)}}
.ft{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ft b{display:block;color:var(--sand2);margin-bottom:3px;font-size:15px}.ft span{color:var(--mut);font-size:13px}
section{padding:34px 0;scroll-margin-top:64px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font-size:clamp(23px,3.6vw,34px);color:var(--sand2)}.sh p{color:var(--mut);font-size:14px;max-width:560px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select,.fld input,.fld select{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:0}
.tools input{flex:1;min-width:150px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{flex:none;padding:7px 15px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--sand);color:#1a1509;border-color:var(--sand);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:rgba(216,195,160,.45)}
.ph{position:relative;aspect-ratio:4/5;background:linear-gradient(160deg,#2a2c33,#1a1c21);overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;transition:opacity .35s,transform .5s}
.ph img+img{position:absolute;inset:0;opacity:0}.card:hover .ph img+img{opacity:1}.card:hover .ph img{transform:scale(1.03)}
.ph.noimg::after{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:42px;color:rgba(216,195,160,.35)}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:#c0392b;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;z-index:2}
.cb{padding:11px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cb .br{font-size:11px;letter-spacing:1.5px;color:var(--ac);text-transform:uppercase}
.cb .nm{font-size:14px;line-height:1.5;min-height:42px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cb .pr{font-weight:700;color:var(--sand2);margin-top:auto;font-size:15px}
.cb .row{display:flex;gap:6px;margin-top:8px}
.cb .row button{flex:1;padding:7px 4px;border-radius:10px;border:1px solid var(--line);font-size:12.5px}
.cb .row .add{background:var(--sand);color:#1a1509;border-color:var(--sand);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.two{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}.two>*{min-width:0}@media(min-width:850px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13.5px;color:var(--mut)}
.fld.r2{flex-direction:row;gap:10px}.fld.r2>div{flex:1;display:flex;flex-direction:column;gap:5px}
.opts{display:flex;gap:7px;flex-wrap:wrap}.opt{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;color:var(--ink)}.opt.on{background:var(--sand);color:#1a1509;border-color:var(--sand);font-weight:700}
.res{display:none}.res.show{display:block}
.big{font-family:'Cormorant Garamond',serif;font-size:64px;line-height:1;color:var(--sand);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kv div{background:var(--bg2);border-radius:12px;padding:10px;text-align:center}.kv b{display:block;font-size:20px;color:var(--sand2)}.kv span{font-size:12px;color:var(--mut)}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini .card{font-size:12px}.mini .nm{font-size:12px;min-height:36px}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:850px){.slots{grid-template-columns:repeat(4,1fr)}}
.slot{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.slot .ph{aspect-ratio:3/4;cursor:default}
.slot .sl{position:absolute;top:8px;inset-inline-start:8px;z-index:2;background:rgba(0,0,0,.6);padding:1px 10px;border-radius:99px;font-size:12px}
.slot .nv{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;gap:4px}
.slot .nv button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:16px}
.slot .nv span{font-size:12.5px;text-align:center;line-height:1.35;flex:1}
.tot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.tot b{font-size:22px;color:var(--sand2)}
.mirror{position:relative;background:#0c0d0f;border:1px dashed var(--line);border-radius:18px;min-height:340px;display:grid;place-items:center;overflow:hidden;touch-action:none}
.mirror canvas[hidden]{display:none}.mirror canvas{max-width:100%;max-height:68vh;display:block}
.mirror .hint{color:var(--mut);text-align:center;padding:20px;font-size:14px}
.busy{position:absolute;inset:0;background:rgba(10,10,12,.72);display:grid;place-items:center;text-align:center;padding:20px;font-size:14px;color:var(--sand2)}.busy[hidden]{display:none}.lay{display:inline-flex;gap:6px;align-items:center}.pick{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.pick img{width:62px;height:78px;object-fit:cover;border-radius:10px;border:2px solid transparent;flex:none;cursor:pointer;background:var(--bg2)}.pick img.on{border-color:var(--sand)}
input[type=range]{width:100%;accent-color:var(--sand)}
.beta{display:inline-block;background:rgba(201,165,106,.15);color:var(--sand);border:1px solid var(--line);font-size:11.5px;padding:1px 9px;border-radius:99px;margin-inline-start:8px;vertical-align:middle;font-family:'Vazirmatn'}
footer{padding:30px 0 20px;border-top:1px solid var(--line);color:var(--mut);font-size:13.5px;text-align:center}
.bar{position:fixed;bottom:0;inset-inline:0;z-index:45;background:rgba(18,19,22,.95);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;gap:10px;backdrop-filter:blur(10px)}
.bar a,.bar button{flex:1;text-align:center;padding:11px;border-radius:99px;font-weight:700;font-size:14px}
.bar .w{background:#25a65b;color:#fff}.bar .c{background:var(--sand);color:#1a1509}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:none;align-items:center;justify-content:center;padding:14px}.ov.show{display:flex}
.md{background:var(--bg2);border:1px solid var(--line);border-radius:22px;width:min(880px,100%);max-height:92vh;overflow:auto;position:relative;display:grid}
@media(min-width:760px){.md{grid-template-columns:1fr 1fr}}
.md .x{position:absolute;top:10px;inset-inline-end:10px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);font-size:18px}
.md .gal{background:#0e0f12;display:flex;flex-direction:column}.md .gal>img{width:100%;aspect-ratio:4/5;object-fit:cover}
.md .th{display:flex;gap:6px;padding:8px}.md .th img{width:54px;height:68px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.6}.md .th img.on{opacity:1;outline:2px solid var(--sand)}
.md .in{padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.md .in h3{font-size:21px}.md .in .pr{font-size:24px;color:var(--sand2);font-weight:700}
.szs{display:flex;gap:7px;flex-wrap:wrap}.sz{min-width:44px;text-align:center;padding:7px 10px;border-radius:10px;border:1px solid var(--line);font-size:14px}.sz.on{background:var(--sand);color:#1a1509;border-color:var(--sand);font-weight:700}
.dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--bg2);z-index:70;transform:translateX(110%);transition:.3s;display:flex;flex-direction:column;border-inline-start:1px solid var(--line)}
[dir=rtl] .dr{transform:translateX(-110%)}.dr.show{transform:none!important}
.dr .h{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.dr .l{flex:1;overflow:auto;padding:10px 14px}
.ci{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ci img{width:56px;height:70px;object-fit:cover;border-radius:8px;flex:none;background:var(--panel)}
.ci .q{display:flex;gap:6px;align-items:center;margin-top:4px}.ci .q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line)}
.dr .f{padding:14px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--sand);color:#1a1509;padding:8px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:.3s}.toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="wrap hd">
 <div class="logo"><span data-t="brand"></span><small>REDA</small></div>
 <nav class="dnav"><a href="#shop" data-t="n_shop"></a><a href="#size" data-t="n_size"></a><a href="#outfit" data-t="n_out"></a><a href="#tryon" data-t="n_try"></a></nav>
 <div class="hdr-r">
  <div class="lang"><button data-l="fa">فا</button><button data-l="ar">ع</button><button data-l="en">EN</button></div>
  <button class="ic" id="cartBtn" aria-label="cart"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="badge" id="cnt">0</span></button>
 </div>
</div></header>

<div class="hero"><div class="wrap">
 <h1 data-th="h1"></h1>
 <p class="sub" data-t="sub"></p>
 <div class="cta"><a class="btn pri" href="#shop" data-t="c_shop"></a><a class="btn" href="#size" data-t="c_size"></a><a class="btn" href="#tryon" data-t="c_try"></a></div>
 <div class="strip" id="strip"></div>
</div></div>

<div class="wrap">
 <div class="feats">
  <div class="ft"><b data-t="f1t"></b><span data-t="f1d"></span></div>
  <div class="ft"><b data-t="f2t"></b><span data-t="f2d"></span></div>
  <div class="ft"><b data-t="f3t"></b><span data-t="f3d"></span></div>
  <div class="ft"><b data-t="f4t"></b><span data-t="f4d"></span></div>
 </div>

 <section id="shop">
  <div class="sh"><h2 data-t="n_shop"></h2><p data-t="shop_d"></p></div>
  <div class="tools"><input id="q" type="search" data-ph="search"><select id="sort"><option value="0" data-t="s0"></option><option value="1" data-t="s1"></option><option value="2" data-t="s2"></option><option value="3" data-t="s3"></option></select></div>
  <div class="chips" id="chips"></div>
  <div class="note" id="count" style="margin:0 0 10px"></div>
  <div class="grid" id="grid"></div>
 </section>

 <section id="size">
  <div class="sh"><h2 data-t="n_size"></h2><p data-t="size_d"></p></div>
  <div class="two">
   <div class="panel">
    <div class="fld r2"><div><label data-t="h"></label><input id="sh" type="number" value="175" min="140" max="210"></div><div><label data-t="w"></label><input id="sw" type="number" value="78" min="40" max="160"></div></div>
    <div class="fld"><label data-t="build"></label><div class="opts" id="obuild"></div></div>
    <div class="fld"><label data-t="fit"></label><div class="opts" id="ofit"></div></div>
    <button class="btn pri" id="sgo" data-t="calc"></button>
    <p class="note" data-t="size_note"></p>
   </div>
   <div class="panel res" id="sres"></div>
  </div>
 </section>

 <section id="outfit">
  <div class="sh"><h2 data-t="n_out"></h2><p data-t="out_d"></p></div>
  <div class="chips" id="ostyle"></div>
  <div class="slots" id="slots"></div>
  <div class="tot"><div><span class="note" data-t="total"></span><br><b id="otot">0</b></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="oshuf" data-t="shuffle"></button><button class="btn pri" id="oadd" data-t="addall"></button></div></div>
 </section>

 <section id="tryon">
  <div class="sh"><h2><span data-t="n_try"></span><span class="beta">BETA</span></h2><p data-t="try_d"></p></div>
  <div class="two">
   <div>
    <div class="mirror" id="mirror"><div class="hint" id="thint"></div><canvas id="cv" hidden></canvas><div class="busy" id="busy" hidden></div></div>
    <div class="note" id="tstat" style="margin-top:8px"></div>
   </div>
   <div class="panel">
    <div class="fld"><label data-t="t1"></label><input type="file" id="file" accept="image/*"></div>
    <div class="fld"><label data-t="t2"></label><div class="pick" id="pick"></div></div>
    <div class="fld"><label data-t="t8"></label><div class="opts" id="layers"></div></div>
    <div class="fld"><label data-t="t3"></label><input type="range" id="tsc" min="70" max="140" value="100"></div>
    <div class="opts" style="margin-bottom:12px"><button class="opt" id="twear" data-t="t9"></button><button class="opt" id="tclr" data-t="t10"></button><button class="opt" id="tdl" data-t="t6"></button><button class="opt" id="tadd" data-t="t7"></button></div>
    <p class="note" data-t="try_note"></p>
   </div>
  </div>
 </section>
</div>

<footer><div class="wrap"><div class="disp" style="font-size:20px;color:var(--sand2);margin-bottom:6px"><span data-t="brand"></span> · REDA</div><div data-t="foot"></div><div style="margin-top:6px" dir="ltr">WhatsApp: 0782 324 7316</div></div></footer>

<div class="bar"><a class="w" id="barwa" target="_blank" rel="noopener" data-t="wa"></a><button class="c" id="barcart" data-t="cart"></button></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="dr" id="dr"><div class="h"><b class="disp" data-t="cart"></b><button class="ic" id="dx">✕</button></div><div class="l" id="cl"></div><div class="f" id="cf"></div></div>
<div class="toast" id="toast"></div>

function calc(){const h=+$('#sh').value,w=+$('#sw').value;if(!h||!w)return;
 let sc=w+(h-172)*.35;let k=sc<60?0:sc<72?1:sc<82?2:sc<92?3:sc<102?4:sc<112?5:6;
 if(bld==3)k++;if(bld==1&&k>0&&w<75)k--;if(fitp==3)k++;if(fitp==1&&k>0)k--;k=Math.max(0,Math.min(6,k));
 const L1=LET[k];let waist=Math.round((.5*w+50+(bld==3?5:0))/2.54);if(waist%2&&waist>30)waist++;waist=Math.max(28,Math.min(40,waist));
 const shoe=Math.max(39,Math.min(47,Math.round(h*.25)));
 const av=D.filter(x=>x.z.includes(L1)||(x.c=='pants'&&x.z.includes(String(waist)))).slice(0,6);
 $('#sres').innerHTML=`<div class="note" style="margin:0">${t('r_top')}</div><div class="big">${L1}</div>
 <div class="kv"><div><b>${L1}</b><span>${t('r_top')}</span></div><div><b>${num(waist)}</b><span>${t('r_jean')}</span></div><div><b>${num(shoe)}</b><span>${t('r_shoe')}</span></div></div>
 <div class="note" style="margin:0 0 4px">${t('r_av')}</div>${av.length?`<div class="mini">${av.map(card).join('')}</div>`:`<div class="note">${t('r_none')}</div>`}`;
 $('#sres').classList.add('show')}
/* outfit */
const SL=[['top',['shirt','tee','knit']],['bot',['pants']],['shoe',['shoes']],['out',['outer']]];let ost='C',oi={};
function pool(s){const cs=SL.find(a=>a[0]==s)[1];let p=D.filter(x=>cs.includes(x.c)&&x.st.includes(ost));if(!p.length)p=D.filter(x=>cs.includes(x.c));return p}
function ostyleUI(){$('#ostyle').innerHTML=['F','C','S'].map(s=>`<button class="chip ${s==ost?'on':''}" data-s="${s}">${t('st_'+s)}</button>`).join('');$$('#ostyle .chip').forEach(b=>b.onclick=()=>{ost=b.dataset.s;oi={};ostyleUI();outfit()})}
function outfit(){$('#slots').innerHTML=SL.map(([s])=>{const p=pool(s);const i=((oi[s]||0)%p.length+p.length)%p.length;oi[s]=i;const x=p[i];
 return `<div class="slot"><div class="ph" data-l="${x.br[0]}"><span class="sl">${t('sl_'+s)}</span>${x.im.slice(0,1).map(u=>`<img src="${u}" referrerpolicy="no-referrer" onerror="imgErr(this)" alt="">`).join('')}</div><div class="nv"><button onclick="nv('${s}',-1)">${L=='en'?'‹':'›'}</button><span>${name(x)}<br><b style="color:var(--sand2)">${price(x)}</b></span><button onclick="nv('${s}',1)">${L=='en'?'›':'‹'}</button></div></div>`}).join('');
 $('#otot').textContent=fmt(cur_out().reduce((a,x)=>a+x.p,0))}
function cur_out(){return SL.map(([s])=>{const p=pool(s);return p[((oi[s]||0)%p.length+p.length)%p.length]})}
function nv(s,d){oi[s]=(oi[s]||0)+d;outfit()}
</script>
<script src="tryon.js"></script>
<script>
/* i18n */
function apply(){const h=document.documentElement;h.lang=L;h.dir=L=='en'?'ltr':'rtl';
 $$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$$('[data-th]').forEach(e=>e.innerHTML=t(e.dataset.th));$$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));$('#thint').textContent=t('thint');
 $('#barwa').href='https://wa.me/'+WA;chips();list();opts();ostyleUI();outfit();renderCart();if($('#sres').classList.contains('show'))calc();pickUI()}
$$('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('lg',L)}catch(e){}apply()});
$('#q').oninput=list;$('#sort').onchange=list;$('#sgo').onclick=calc;$('#oshuf').onclick=()=>{SL.forEach(([s])=>oi[s]=Math.floor(Math.random()*99));outfit()};
$('#oadd').onclick=()=>{cur_out().forEach(x=>add(x.id,x.z&&x.z.length?x.z[Math.floor(x.z.length/2)]:null))};
$('#cartBtn').onclick=$('#barcart').onclick=()=>$('#dr').classList.add('show');$('#dx').onclick=()=>$('#dr').classList.remove('show');
$('#ov').onclick=e=>{if(e.target.id=='ov')closeP()};
try{cart=JSON.parse(localStorage.getItem('cart')||'[]').filter(c=>D.find(y=>y.id==c.id))}catch(e){cart=[]}
strip();apply();if(location.protocol==='file:')stat(t('e_file'));
</script>
